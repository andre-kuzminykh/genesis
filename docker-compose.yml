services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: validation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      VP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/validation
      VP_DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/validation
      VP_ENVIRONMENT: dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn validation_pipeline.app:app --host 0.0.0.0 --port 8000
      "

  ui:
    build: .
    environment:
      API_BASE: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  pgdata:
